<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Stephanie Patterson: IT Accessibility Specialist</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<!-- <link rel="stylesheet" href="css/reset.css">
		<link rel="stylesheet" href="css/style.css"> -->
		<script src="js/jquery.min.js"></script>
	</head>
	<body>
		<header role="banner">
			<img class="mobilelogo" src="images/rit-logo.jpg" alt="RIT Tiger logo">
			<img class="desktoplogo" src="images/rit-logo.jpg" alt="RIT Tiger logo">
			<a href="#mobileNav"><img class="menu" src="images/menu.png" alt="Mobile navigation menu"></a>
			<h1>Stephanie Patterson: IT Accessibility Specialist</h1>
		</header>

		<nav id="standardNav" role="navigation">
			<ul>
				<li>
					<a href="index.html">Home</a>
				</li>
				<li>
					<a href="about.html">About</a>
				</li>
				<li>
					<a href="contact.html">Contact</a>
				</li>
			</ul>
		</nav>

		<main role="main">
			<form>
				<p>
					<label for="name-field">Name *</label>
					<input id="name-field" type="text" name="name" onkeyup="validateField(event);" onblur="validateField(event);" data-errmsg="Please enter your name." aria-required="true" required>
				</p>
				<div id="name-field-err" class="error"></div>
				<p>
					<label for="email-field">Email  *</label>
					<input id="email-field" type="email" name="email" onkeyup="validateField(event);" onblur="validateField(event);" data-errmsg="Please enter a valid email address." aria-required="true" required>
				</p>
				<div id="email-field-err" class="error"></div>
				<p>
					<label for="subject-field">Subject  *</label>
					<input id="subject-field" type="text" name="subject" onkeyup="validateField(event);" onblur="validateField(event);" data-errmsg="Please enter a subject for your message." aria-required="true" required>
				</p>
				<div id="subject-field-err" class="error"></div>
				<p>
					<label for="msg-field">Message  *</label>
					<textarea id="msg-field" name="message" onkeyup="validateField(event);" onblur="validateField(event);" data-errmsg="Please enter a message." aria-required="true" required></textarea>
				</p>
				<div id="msg-field-err" class="error"></div>
				<button type="submit">Submit</button>
			</form>
		</main>

		<footer role="contentinfo">
			<p>Copyright 2024, Stephanie Patterson</p>
		</footer>
		
		<nav id="mobileNav" role="navigation">
			<ul>
				<li>
					<a href="index.html">Home</a>
				</li>
				<li>
					<a href="about.html">About</a>
				</li>
				<li>
					<a href="contact.html">Contact</a>
				</li>
			</ul>
		</nav>
		
		<script type="text/javascript"  src="js/validate.js"></script>
	</body>
</html>
